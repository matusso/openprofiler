sonar.projectKey=matusso_openprofiler
sonar.organization=matusso

sonar.projectName=openprofiler
sonar.sourceEncoding=UTF-8

sonar.sources=.
# Test fixtures, workloads and scenario apps are not product code.
sonar.exclusions=**/tests/**,java/bench/**,java/matrix/**,java/testapp/**,scripts/e2e/**,ide/intellij/src/test/**,ui/src-tauri/gen/**

# Written by `cargo llvm-cov` in the SonarCloud workflow.
sonar.rust.lcov.reportPaths=target/lcov.info

# Classes built by java/build.sh (Java 11 bytecode).
sonar.java.source=11
sonar.java.binaries=java/openprofiler-boot/build/classes,java/openprofiler-api/build/classes
