[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/matusso/openprofiler"
rust-version = "1.85"

[workspace.dependencies]
openprofiler-model = { path = "crates/openprofiler-model" }
openprofiler-proto = { path = "crates/openprofiler-proto" }
openprofiler-snapshot = { path = "crates/openprofiler-snapshot" }
openprofiler-hprof = { path = "crates/openprofiler-hprof" }
openprofiler-heap = { path = "crates/openprofiler-heap" }
openprofiler-jfr = { path = "crates/openprofiler-jfr" }
openprofiler-attach = { path = "crates/openprofiler-attach" }
openprofiler-remote = { path = "crates/openprofiler-remote" }
openprofiler-daemon = { path = "crates/openprofiler-daemon" }
openprofiler-link = { path = "crates/openprofiler-link" }
openprofiler-agent = { path = "crates/openprofiler-agent" }
openprofiler-dex = { path = "crates/openprofiler-dex" }
jvmti-sys = { path = "crates/jvmti-sys" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
memmap2 = "0.9"
zstd = "0.13"
prost = "0.14"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
flate2 = "1"
tempfile = "3"
libc = "0.2"
rustls = "0.23"
rcgen = "0.14"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
parking_lot = "0.12"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 4

[profile.release-agent]
inherits = "release"
panic = "abort"
debug = false
strip = "debuginfo"

# Small static helper binary for remote hosts and containers.
[profile.release-relay]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
