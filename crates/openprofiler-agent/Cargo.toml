[package]
name = "openprofiler-agent"
description = "OpenProfiler native JVMTI agent (libopenprofiler_agent): sampling, allocation/monitor events, telemetry, agent-link server"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jvmti-sys.workspace = true
openprofiler-model.workspace = true
openprofiler-proto.workspace = true
openprofiler-hprof = { path = "../openprofiler-hprof" }
libc = "0.2"
parking_lot = "0.12"
serde_json = "1"
rustc-hash = "2"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[lints]
workspace = true
