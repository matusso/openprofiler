// OpenProfiler agent-link protocol, v1.
//
// Spoken between the in-JVM agent (server) and openprofiler-daemon (client). See
// docs/spec/agent-link.md for framing and the session lifecycle.
syntax = "proto3";

package openprofiler.link.v1;

// ---------------------------------------------------------------------------------------------
// Handshake
// ---------------------------------------------------------------------------------------------

message JvmInfo {
  uint32 pid = 1;
  string name = 2;
  string vm_name = 3;
  string vm_version = 4;
  string vm_vendor = 5;
  string java_version = 6;
  repeated string jvm_args = 7;
  string main_class = 8;
  string os = 9;
  string arch = 10;
  uint32 cpus = 11;
  uint64 max_heap = 12;
  // Epoch nanoseconds.
  int64 start_time = 13;
}

// Agent -> daemon, first frame on every connection.
message Hello {
  string protocol_semver = 1;
  string agent_version = 2;
  JvmInfo jvm = 3;
  // Granted feature groups: "cpu", "cpu_async", "cpu_jfr", "alloc", "monitor", "monitor_usage" (owners of
  // contended monitors), "park" (j.u.c lock hooks), "threads", "telemetry", "heap_dump",
  // "thread_dump", "virtual_threads", "triggers", "mbeans", "instrument" (bytecode
  // instrumentation), "probes", ...
  repeated string capabilities = 4;
  // Echo of the daemon's token (daemon -> agent direction uses Auth below).
  string token = 5;
  // Random per agent instance. A daemon resuming a connection compares it to detect restarts.
  uint64 instance_id = 6;
  // "live" or "offline".
  string mode = 7;
}

// Daemon -> agent, first frame from the daemon. The agent validates the token and closes the
// connection if it does not match.
message Auth {
  string token = 1;
  string client = 2;
}

message SessionConfig {
  bool cpu = 1;
  // Sampling interval in microseconds.
  uint32 cpu_interval_us = 2;
  bool alloc = 3;
  // Mean bytes between allocation samples.
  uint32 alloc_interval_bytes = 4;
  bool monitors = 5;
  // Monitor events shorter than this are aggregated but not reported individually.
  uint32 monitor_threshold_us = 6;
  bool telemetry = 7;
  bool thread_states = 8;
  // The CPU sampler in use: "async", "jfr" or "sync".
  string sampler = 9;
}

// Agent -> daemon after a successful Auth.
message Welcome {
  SessionConfig config = 1;
  // Where the agent will resume sending from (the daemon's last ack if the agent still has the
  // data, otherwise the oldest retained position).
  Watermark resume_from = 2;
}

// Daemon -> agent, optional, right after Welcome: resume position the daemon already holds.
message Resume {
  uint64 instance_id = 1;
  Watermark watermark = 2;
}

// ---------------------------------------------------------------------------------------------
// Data plane
// ---------------------------------------------------------------------------------------------

// Absolute positions in each of the agent's append-only tables.
message Watermark {
  uint64 strings = 1;
  uint64 methods = 2;
  uint64 frames = 3;
  uint64 stacks = 4;
  uint64 threads = 5;
  uint64 samples = 6;
  uint64 telemetry = 7;
  uint64 thread_states = 8;
  uint64 monitors = 9;
  uint64 gc = 10;
  uint64 bookmarks = 11;
  // Monotonic sequence number of the batch that produced this watermark.
  uint64 seq = 12;
  uint64 thread_dumps = 13;
  uint64 probes = 14;
  uint64 probe_calls = 15;
  uint64 probe_events = 16;
  uint64 probe_controls = 17;
  uint64 call_trace = 18;
  uint64 call_sites = 19;
  uint64 complexity = 20;
}

message SymbolDelta {
  uint32 string_base = 1;
  repeated string strings = 2;
  uint32 method_base = 3;
  repeated uint32 method_class = 4;
  repeated uint32 method_name = 5;
  repeated uint32 method_signature = 6;
  uint32 frame_base = 7;
  repeated uint32 frame_method = 8;
  repeated sint32 frame_line = 9;
  // openprofiler_model::FrameKind as u8.
  repeated uint32 frame_kind = 10;
}

// New nodes of the global stack trie. Node `base + i` has parent `parent[i]` and leaf frame
// `frame[i]`. Node 0 is the empty stack and is never sent.
message StackDelta {
  uint32 base = 1;
  repeated uint32 parent = 2;
  repeated uint32 frame = 3;
}

// Columnar sample rows of one kind (openprofiler_model::SampleKind as u8).
message SampleBatch {
  uint32 kind = 1;
  repeated int64 time = 2;
  repeated uint32 thread = 3;
  repeated uint32 state = 4;
  repeated uint32 stack = 5;
  repeated uint64 weight = 6;
  repeated uint32 count = 7;
  // String id of the allocated class; 0xFFFFFFFF if none.
  repeated uint32 class_id = 8;
}

message ThreadInfo {
  uint64 java_id = 1;
  uint64 os_id = 2;
  string name = 3;
  string group = 4;
  bool is_virtual = 5;
  bool is_daemon = 6;
  int64 start = 7;
  int64 end = 8;
}

message ThreadUpdate {
  uint32 index = 1;
  string name = 2;
  int64 end = 3;
}

message ThreadInfoBatch {
  uint32 base = 1;
  repeated ThreadInfo threads = 2;
  repeated ThreadUpdate updates = 3;
}

message ThreadStateBatch {
  repeated uint32 thread = 1;
  repeated int64 start = 2;
  repeated int64 end = 3;
  repeated uint32 state = 4;
}

message TelemetrySeriesDelta {
  string key = 1;
  string label = 2;
  // openprofiler_model::Unit: 0 nanos, 1 bytes, 2 count, 3 percent, 4 per_second.
  uint32 unit = 3;
  repeated int64 time = 4;
  repeated double value = 5;
}

message TelemetryBatch {
  repeated TelemetrySeriesDelta series = 1;
}

message MonitorEvent {
  int64 start = 1;
  int64 duration = 2;
  // 0 enter, 1 wait, 2 park.
  uint32 kind = 3;
  uint32 thread = 4;
  // Thread index + 1 of the owner, 0 if unknown.
  uint32 owner = 5;
  // Class of the monitor object; for park events, of the blocker (e.g. a ReentrantLock's sync).
  string monitor_class = 6;
  // Identity hash code of the monitor/blocker object (0 if unknown).
  uint64 monitor_id = 7;
  uint32 stack = 8;
}

message MonitorEventBatch {
  repeated MonitorEvent events = 1;
}

message GcEvent {
  int64 start = 1;
  int64 duration = 2;
  string name = 3;
  string cause = 4;
  uint64 heap_before = 5;
  uint64 heap_after = 6;
  int64 pause = 7;
}

message GcEventBatch {
  repeated GcEvent events = 1;
}

message Bookmark {
  int64 time = 1;
  string label = 2;
  string color = 3;
}

// ---------------------------------------------------------------------------------------------
// Probes (see agent-link.md, "Probes"). Payloads are string ids of the symbol table.
// ---------------------------------------------------------------------------------------------

// A registered probe. The table is positional: probe `i` is the i-th ever sent.
message ProbeInfo {
  string id = 1;
  string name = 2;
  string payload_label = 3;
  // Empty if the probe has no control objects.
  string control_label = 4;
}

// Probe calls aggregated per (second, probe, payload, thread, stack), columnar.
message ProbeCallBatch {
  repeated int64 time = 1;
  repeated uint32 probe = 2;
  repeated uint32 payload = 3;
  repeated uint32 thread = 4;
  repeated uint32 stack = 5;
  repeated uint32 count = 6;
  repeated int64 duration = 7;
  repeated int64 max = 8;
  repeated uint32 errors = 9;
}

message ProbeEvent {
  int64 start = 1;
  int64 duration = 2;
  uint32 probe = 3;
  uint32 payload = 4;
  uint32 thread = 5;
  uint32 stack = 6;
  string error = 7;
  // 0 if none.
  uint64 control = 8;
  string detail = 9;
  string context = 10;
}

message ControlEvent {
  int64 time = 1;
  uint32 probe = 2;
  uint64 id = 3;
  // 0 open, 1 close.
  uint32 kind = 4;
  string description = 5;
  uint32 thread = 6;
  uint32 stack = 7;
}

// ---------------------------------------------------------------------------------------------
// Instrumented method analysis (see agent-link.md, "Call tracer, outliers and complexity").
// Frames are frame ids of the symbol table; stacks are global stack ids.
// ---------------------------------------------------------------------------------------------

// Call tracer: entries and exits of instrumented methods in order, per thread, columnar.
message CallTraceBatch {
  repeated int64 time = 1;
  repeated uint32 thread = 2;
  repeated uint32 frame = 3;
  // false entry, true exit.
  repeated bool exit = 4;
}

// Per call site (the stack of an instrumented call), calls since the thread's previous flush:
// count, summed inclusive time and the slowest call. Columnar.
message CallSiteBatch {
  repeated int64 time = 1;
  repeated uint32 thread = 2;
  repeated uint32 stack = 3;
  repeated uint32 count = 4;
  repeated int64 total = 5;
  repeated int64 max = 6;
}

// Complexity analysis: (argument-derived size, duration) of calls of configured methods. Columnar.
message ComplexityBatch {
  repeated int64 time = 1;
  repeated uint32 thread = 2;
  repeated uint32 frame = 3;
  repeated uint64 size = 4;
  repeated int64 duration = 5;
}

// One flush of everything that changed between `from` and `to`. Order of application:
// symbols, stacks, threads, then the rest.
message DataBatch {
  Watermark from = 1;
  Watermark to = 2;
  SymbolDelta symbols = 3;
  StackDelta stacks = 4;
  ThreadInfoBatch threads = 5;
  repeated SampleBatch samples = 6;
  TelemetryBatch telemetry = 7;
  ThreadStateBatch thread_states = 8;
  MonitorEventBatch monitors = 9;
  GcEventBatch gc = 10;
  repeated Bookmark bookmarks = 11;
  // Agent-side wall clock when the batch was cut (epoch nanos).
  int64 time = 12;
  // Thread dumps taken by the agent itself (triggers).
  repeated ThreadDump thread_dumps = 13;
  repeated ProbeInfo probes = 14;
  ProbeCallBatch probe_calls = 15;
  repeated ProbeEvent probe_events = 16;
  repeated ControlEvent probe_controls = 17;
  CallTraceBatch call_trace = 18;
  CallSiteBatch call_sites = 19;
  ComplexityBatch complexity = 20;
}

// Daemon -> agent: everything up to `watermark` has been applied. In live mode the agent may
// drop acknowledged sample/event rows (symbols and stacks are always retained).
message Ack {
  Watermark watermark = 1;
}

// ---------------------------------------------------------------------------------------------
// Request / response
// ---------------------------------------------------------------------------------------------

message ThreadDumpRequest {}

message HeapDumpRequest {
  // "hprof" (only format in v1).
  string format = 1;
  bool live_only = 2;
  // If set and the daemon shares the filesystem, the agent writes here and sends no blob.
  string local_path = 3;
  // "hotspot" (default: HotSpotDiagnosticMXBean.dumpHeap) or "native" (JVMTI heap walk in the
  // agent; reachable objects only, so live_only is implied). Both write HPROF.
  string dumper = 4;
  // Only the objects recorded by allocation recording, their referrer chains from the GC roots
  // and all classes. Uses the native dumper.
  bool recorded_only = 5;
}

message SetRecording {
  // "cpu", "alloc", "monitor", "telemetry", "thread_states", "calls" (instrumented call counts),
  // "probes", "trace" (call tracer).
  string kind = 1;
  bool enabled = 2;
  uint32 interval_us = 3;
  // "trace": stop after this long (0 = 10 s) or this many events (0 = 1,000,000).
  uint32 duration_ms = 4;
  uint32 max_events = 5;
}

message UpdateConfig {
  SessionConfig config = 1;
}

message SaveSnapshot {
  string path = 1;
}

message RunGc {}

message AddBookmark {
  string label = 1;
  string color = 2;
}

// ---------------------------------------------------------------------------------------------
// Triggers: conditions evaluated in the agent that run actions. See agent-link.md.
// ---------------------------------------------------------------------------------------------

// Fires `delay_ms` after the trigger is installed, then every `period_ms` (0 = once).
message TimerCondition {
  int64 delay_ms = 1;
  int64 period_ms = 2;
}

// Fires when a telemetry series (or `heap.used_pct`) stays above/below a value for `for_ms`.
// It re-arms once the condition no longer holds.
message ThresholdCondition {
  string metric = 1;
  optional double above = 2;
  optional double below = 3;
  int64 for_ms = 4;
}

// JVMTI ResourceExhausted: Java heap, metaspace or native threads.
message OutOfMemoryCondition {}

// When a method is called. `class_name` is a Java class name (`com.acme.Orders`); `method` a
// method name, optionally with a descriptor (`place(Ljava/lang/String;)V`); `*` matches all
// methods of the class.
message MethodCondition {
  string class_name = 1;
  string method = 2;
}

// When the agent goes live (or when the trigger is installed on a live agent).
message JvmStartCondition {}

// At VM death, before the agent shuts down.
message JvmExitCondition {}

message HeapDumpAction {
  // Path on the agent's filesystem; `{pid}`, `{time}` (epoch seconds), `{trigger}`, `{n}` (fire
  // count) are substituted.
  string path = 1;
  bool live_only = 2;
  // As in HeapDumpRequest.
  string dumper = 3;
  bool recorded_only = 4;
}

message TriggerAction {
  oneof kind {
    // "cpu", "alloc" or "monitor".
    string start_recording = 1;
    string stop_recording = 2;
    AddBookmark bookmark = 3;
    // `.oplink` path; same substitutions as HeapDumpAction.path.
    string save_snapshot = 4;
    HeapDumpAction heap_dump = 5;
    // The dump is added to the data plane (DataBatch.thread_dumps).
    ThreadDumpRequest thread_dump = 6;
    RunGc run_gc = 7;
  }
}

message Trigger {
  string id = 1;
  oneof condition {
    TimerCondition timer = 2;
    ThresholdCondition threshold = 3;
    OutOfMemoryCondition out_of_memory = 4;
    JvmStartCondition jvm_start = 5;
    JvmExitCondition jvm_exit = 6;
    MethodCondition method = 10;
  }
  repeated TriggerAction actions = 7;
  // Minimum time between two firings.
  int64 cooldown_ms = 8;
  // 0 = unlimited.
  uint32 max_fires = 9;
}

// Replaces the agent's trigger set.
message SetTriggers {
  repeated Trigger triggers = 1;
}

// ---------------------------------------------------------------------------------------------
// MBean browser. Values are JSON (see agent-link.md). `server` selects the MBean server: empty
// for the platform server, otherwise an `MBeanServerInfo.id` from MBeanServersRequest.
// ---------------------------------------------------------------------------------------------

// Lists the MBean servers: the platform one, others in the JVM and connected remote JMX servers.
message MBeanServersRequest {}

message MBeanServerInfo {
  // Empty for the platform server, the delegate's MBeanServerId for other servers in the JVM,
  // the service URL for remote ones.
  string id = 1;
  // "platform", "local" or "remote".
  string kind = 2;
  string label = 3;
  string default_domain = 4;
  uint32 bean_count = 5;
  // Why the server cannot be reached (remote connection closed or failing).
  string error = 6;
}

message MBeanServerList {
  repeated MBeanServerInfo servers = 1;
}

// Connects the JVM to a remote JMX server (`enabled`), or disconnects it. Answers MBeanServerList.
message MBeanConnectRequest {
  // A JMX service URL, e.g. service:jmx:rmi:///jndi/rmi://host:9010/jmxrmi.
  string url = 1;
  string username = 2;
  string password = 3;
  bool enabled = 4;
}

// Lists MBeans whose ObjectName matches `pattern` (an ObjectName pattern; empty = all).
message MBeanListRequest {
  string pattern = 1;
  string server = 2;
}

message MBeanSummary {
  string name = 1;
  string class_name = 2;
  string description = 3;
}

// A numeric MBean attribute sampled as a telemetry series (key `mbean:<name>#<attribute>[.<item>]`).
message TrackedAttribute {
  string key = 1;
  string label = 2;
  // openprofiler_model::Unit, as in TelemetrySeriesDelta.
  uint32 unit = 3;
  string mbean = 4;
  string attribute = 5;
  // Item of a CompositeData attribute (e.g. "used" of HeapMemoryUsage); empty for plain numbers.
  string item = 6;
  string server = 7;
}

message MBeanList {
  repeated MBeanSummary beans = 1;
  // Attributes currently sampled as telemetry.
  repeated TrackedAttribute tracked = 2;
}

message MBeanGetRequest {
  string name = 1;
  string server = 2;
}

message MBeanAttribute {
  string name = 1;
  string type = 2;
  string description = 3;
  bool readable = 4;
  bool writable = 5;
  // The current value as JSON; empty if it could not be read (see `error`).
  string value_json = 6;
  string error = 7;
}

message MBeanParameter {
  string name = 1;
  string type = 2;
  string description = 3;
}

message MBeanOperation {
  string name = 1;
  string return_type = 2;
  string description = 3;
  // "info", "action", "action_info" or "unknown".
  string impact = 4;
  repeated MBeanParameter params = 5;
}

message MBeanInfo {
  string name = 1;
  string class_name = 2;
  string description = 3;
  repeated MBeanAttribute attributes = 4;
  repeated MBeanOperation operations = 5;
  repeated MBeanNotificationInfo notifications = 6;
}

// A notification the MBean declares it can emit.
message MBeanNotificationInfo {
  // Notification class name.
  string name = 1;
  string description = 2;
  repeated string types = 3;
}

// Arguments are strings converted to the parameter types (primitives, their boxes, String,
// ObjectName, and arrays of those as JSON arrays or comma-separated lists).
message MBeanInvokeRequest {
  string name = 1;
  string operation = 2;
  // Parameter types, selecting the overload.
  repeated string signature = 3;
  repeated string args = 4;
  string server = 5;
}

message MBeanInvokeResult {
  string value_json = 1;
}

// Sets a writable attribute; `value` is converted like an MBeanInvokeRequest argument.
message MBeanSetRequest {
  string name = 1;
  string attribute = 2;
  string value = 3;
  string server = 4;
}

// Starts (`enabled`) or stops sampling a numeric attribute as telemetry, once per second.
message MBeanTrackRequest {
  string name = 1;
  string attribute = 2;
  string item = 3;
  // Defaults to "<attribute>[.<item>] (<bean>)".
  string label = 4;
  uint32 unit = 5;
  bool enabled = 6;
  string server = 7;
}

// Adds (`enabled`) or removes a notification listener on one MBean. Answers MBeanNotifications
// with the subscriptions only.
message MBeanSubscribeRequest {
  string server = 1;
  string name = 2;
  bool enabled = 3;
}

// The buffered notifications (the agent keeps the last 1000) with `seq` above `after`.
message MBeanNotificationsRequest {
  uint64 after = 1;
}

message MBeanNotification {
  // Increasing per agent, starting at 1.
  uint64 seq = 1;
  // Epoch nanoseconds (millisecond precision).
  int64 time = 2;
  string server = 3;
  // The subscribed MBean.
  string source = 4;
  string type = 5;
  int64 sequence_number = 6;
  string message = 7;
  // User data as JSON; for attribute change notifications {attribute, type, old, new}.
  string data_json = 8;
}

message MBeanSubscription {
  string server = 1;
  string name = 2;
}

message MBeanNotifications {
  repeated MBeanNotification notifications = 1;
  repeated MBeanSubscription subscriptions = 2;
  // The newest sequence number; pass it as the next `after`.
  uint64 last_seq = 3;
  // Notifications after `after` dropped from the buffer before they were read.
  uint64 missed = 4;
}

// Replaces the instrumentation settings and retransforms affected classes. Patterns are Java
// class names with `*` (any characters) and `**`/trailing `.*` wildcards, e.g. `com.acme.*`.
message SetInstrumentation {
  // Classes whose methods get exact call counts and times (SampleKind calls).
  repeated string include = 1;
  repeated string exclude = 2;
  // Enabled probe ids; empty = all. `none` disables every probe.
  repeated string probes = 3;
  // Methods whose calls record (size, duration) for complexity analysis:
  // `class.method[#arg]`, class with `*` wildcards; `arg` is a parameter index or `this`, by
  // default the first argument with a size (collection, map, array, string, number).
  repeated string complexity = 4;
}

// Answers Instrumentation with the current settings and statistics.
message InstrumentationRequest {}

message InstrumentationInfo {
  repeated string include = 1;
  repeated string exclude = 2;
  repeated ProbeInfo available_probes = 3;
  repeated string enabled_probes = 4;
  uint32 instrumented_classes = 5;
  uint32 instrumented_methods = 6;
  // Methods removed by auto-tuning (hot and trivial), as `class.method`.
  repeated string disabled_methods = 7;
  repeated string complexity = 8;
  // Call tracer state: running, events recorded by the current (or last) trace.
  bool trace_active = 9;
  uint64 trace_events = 10;
}

message Request {
  uint64 id = 1;
  oneof kind {
    ThreadDumpRequest thread_dump = 2;
    HeapDumpRequest heap_dump = 3;
    SetRecording set_recording = 4;
    UpdateConfig update_config = 5;
    SaveSnapshot save_snapshot = 6;
    RunGc run_gc = 7;
    AddBookmark bookmark = 8;
    SetTriggers set_triggers = 9;
    MBeanListRequest mbean_list = 10;
    MBeanGetRequest mbean_get = 11;
    MBeanInvokeRequest mbean_invoke = 12;
    MBeanSetRequest mbean_set = 13;
    MBeanTrackRequest mbean_track = 14;
    MBeanServersRequest mbean_servers = 15;
    MBeanConnectRequest mbean_connect = 16;
    MBeanSubscribeRequest mbean_subscribe = 17;
    MBeanNotificationsRequest mbean_notifications = 18;
    SetInstrumentation set_instrumentation = 19;
    InstrumentationRequest instrumentation = 20;
  }
}

message DumpedThread {
  string name = 1;
  uint64 java_id = 2;
  string state = 3;
  bool is_virtual = 4;
  repeated string frames = 5;
  repeated string locked = 6;
  string waiting_on = 7;
}

message ThreadDump {
  int64 time = 1;
  string label = 2;
  repeated DumpedThread threads = 3;
}

message HeapDumpResult {
  // Non-zero when the dump follows as BlobChunk frames.
  uint64 blob_id = 1;
  uint64 size = 2;
  string format = 3;
  // Set when the dump was written to HeapDumpRequest.local_path.
  string local_path = 4;
}

message SnapshotResult {
  string path = 1;
}

message Response {
  uint64 id = 1;
  bool ok = 2;
  string error = 3;
  oneof result {
    ThreadDump thread_dump = 4;
    HeapDumpResult heap_dump = 5;
    SnapshotResult snapshot = 6;
    // MBeanList and MBeanTrack (the latter with `tracked` only).
    MBeanList mbean_list = 7;
    MBeanInfo mbean_info = 8;
    MBeanInvokeResult mbean_invoke = 9;
    // MBeanServers and MBeanConnect.
    MBeanServerList mbean_servers = 10;
    // MBeanNotifications and MBeanSubscribe.
    MBeanNotifications mbean_notifications = 11;
    // SetInstrumentation and Instrumentation.
    InstrumentationInfo instrumentation = 12;
  }
}

message BlobChunk {
  uint64 blob_id = 1;
  uint64 offset = 2;
  bytes data = 3;
  bool last = 4;
}

message Error {
  string message = 1;
  bool fatal = 2;
}

message Ping {
  int64 time = 1;
}

// Header record of an offline `.oplink` recording file (see agent-link.md).
message RecordingHeader {
  Hello hello = 1;
  int64 created = 2;
}
